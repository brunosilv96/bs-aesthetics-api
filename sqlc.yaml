version: "2"

sql:
  - schema: "database/migrations"
    queries: "database/query"
    engine: "postgresql"

    gen:
      go:
        package: "database"
        out: "database/sqlc"
        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true

        overrides:
          - db_type: "pg_catalog.date"
            nullable: false
            go_type:
              import: "time"
              type: "Time"

          - db_type: "pg_catalog.timestamp"
            nullable: false
            go_type:
              import: "time"
              type: "Time"

          - db_type: "pg_catalog.date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "pg_catalog.timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: "Time"