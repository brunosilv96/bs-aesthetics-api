services:
  postgres:
      image: postgres:18
      container_name: bs-aesthetics-pg
      env_file:
        - .env
      ports:
        - 5432:5432
      volumes:
        - postgres_18_data:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  postgres_18_data: